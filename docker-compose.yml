version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: lotto_user
      POSTGRES_PASSWORD: lotto_pass
      POSTGRES_DB: lotto_db
    ports:
      - "5432:5432"
    volumes:
      - /mnt/postgres-data/pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: /bin/sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://lotto_user:lotto_pass@db:5432/lotto_db
    depends_on:
      - db

volumes:
  pgdata: 