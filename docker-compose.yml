version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: lotto_user
      POSTGRES_PASSWORD: lotto_pass
      POSTGRES_DB: lotto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotto_user -d lotto_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    user: "1001:1002"
    command: /bin/sh -c "cd /app && sleep 10 && PYTHONPATH=/app:/app/scripts alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lotto_user:lotto_pass@db:5432/lotto_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '1'
          memory: 768M

  cron:
    build:
      context: .
      dockerfile: cron/Dockerfile
    restart: always
    user: "1001:1002"
    privileged: true
    ports:
      - "8002:8002"
    volumes:
      - ./cron:/app/cron
      - ./shared:/app/shared
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=postgresql://lotto_user:lotto_pass@db:5432/lotto_db
      - GCS_BUCKET_NAME=lotto-predictor-backups
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    restart: always
    user: "1001:1002"
    env_file:
      - ./email-service/.env
    ports:
      - "8001:8000"
    volumes:
      - ./email-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: always
    user: "1001:1002"
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://lotto_user:lotto_pass@db:5432/lotto_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

volumes:
  postgres_data: 