version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    # Resource priority tier 3/4 (4/10)
    cpu_shares: 384
    mem_limit: 384m
    environment:
      POSTGRES_USER: lotto_user
      POSTGRES_PASSWORD: lotto_pass
      POSTGRES_DB: lotto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotto_user -d lotto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    cpu_shares: 512
    mem_limit: 512m
    user: "1001:1002"
    # If alembic_version points at a missing revision, upgrade may fail; continue so API still starts.
    command:
      - /bin/sh
      - -c
      - >-
        cd /app && sleep 10 && export PYTHONPATH=/app:/app/scripts &&
        (alembic upgrade head || echo "WARNING alembic upgrade skipped") &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lotto_user:lotto_pass@db:5432/lotto_db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  # Same stack/network as backend so DATABASE_URL host "db" resolves; replaces ad-hoc bridge-only debug container.
  # Dev-only: minimal CPU/RAM so prod stacks (n8n, etc.) win under load.
  backend-debug:
    build:
      context: .
      dockerfile: backend/Dockerfile
    cpu_shares: 64
    mem_limit: 192m
    user: "1001:1002"
    command:
      - /bin/sh
      - -c
      - >-
        cd /app && sleep 5 && export PYTHONPATH=/app:/app/scripts &&
        (alembic upgrade head || echo "WARNING alembic upgrade skipped") &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    ports:
      - "8877:8000"
    environment:
      - DATABASE_URL=postgresql://lotto_user:lotto_pass@db:5432/lotto_db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=DEBUG
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  cron:
    build:
      context: .
      dockerfile: cron/Dockerfile
    cpu_shares: 256
    mem_limit: 384m
    user: "1001:1002"
    # Host docker group GID so non-root user can use mounted /var/run/docker.sock (see `getent group docker` on host).
    group_add:
      - "${DOCKER_GID:-112}"
    privileged: true
    ports:
      - "8002:8002"
    volumes:
      - ./cron:/app/cron
      - ./shared:/app/shared
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=postgresql://lotto_user:lotto_pass@db:5432/lotto_db
      - GCS_BUCKET_NAME=lotto-predictor-backups
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
    depends_on:
      backend:
        condition: service_started

  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    cpu_shares: 128
    mem_limit: 256m
    user: "1001:1002"
    env_file:
      - ./email-service/.env
    ports:
      - "8001:8000"
    volumes:
      - ./email-service:/app
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      - backend

volumes:
  postgres_data: 