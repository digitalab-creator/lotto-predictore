<!DOCTYPE html>
<html>
<head>
    <title>Error Notification - {{ service }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .error-container {
            background-color: #fff3f3;
            border: 1px solid #ffcdd2;
            border-radius: 4px;
            padding: 20px;
            margin: 20px 0;
        }
        .error-header {
            color: #d32f2f;
            margin-top: 0;
        }
        .error-details {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
            white-space: pre-wrap;
            font-family: monospace;
            overflow-x: auto;
        }
        .service-info {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .script-info {
            color: #666;
            font-style: italic;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1 class="error-header">Error Notification</h1>
    
    <div class="service-info">
        Service: {{ service }}
        {% if script %}
        <div class="script-info">Script: {{ script }}</div>
        {% endif %}
    </div>

    <div class="error-container">
        <h2>Error Message</h2>
        <div class="error-details">{{ error_message }}</div>
    </div>

    {% if traceback %}
    <div class="error-container">
        <h2>Traceback</h2>
        <div class="error-details">{{ traceback }}</div>
    </div>
    {% endif %}
</body>
</html>
